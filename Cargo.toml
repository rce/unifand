[package]
name = "unifand"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unifanctl"
path = "src/bin/unifanctl.rs"

[[bin]]
name = "unifand"
path = "src/bin/unifand.rs"

[dependencies]
hidapi = "2"
rusb = "0.9"
des = "0.8"
cbc = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
notify = "8"
